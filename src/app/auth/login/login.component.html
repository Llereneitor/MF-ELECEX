<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <img src="logo-elecex.png" alt="Elecex Logo" class="logo">
    </div>
    <!-- <h2>Bienvenido a Elecex</h2>
    <p>Accede con tus credenciales</p> -->
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" type="text" formControlName="username" placeholder="Ingrese su usuario" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="Ingrese su contraseña" />
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loading">Iniciar Sesión</button>
    </form>
  </div>
</div>
